<h1>CityBuddy &#128690;</h1>

<div class="messages">
  @for (message of messages(); track $index) {
    <div [class]="message.role">
      <markdown [data]="message.content"></markdown>
    </div>
  }
  @if (isLoading()) {
    <div class="assistant">
      <p>
        Ich prüfe das kurz<span class="dots">
          <span>.</span>
          <span>.</span>
          <span>.</span>
        </span>
      </p>
    </div>
  }
</div>

<div class="prompt-suggestions" aria-label="Fragenvorschläge">
  @for (prompt of suggestionPrompts; track prompt) {
    <button type="button" class="prompt-chip" (click)="chatRequest(prompt)">
      {{ prompt }}
    </button>
  }
</div>

<div class="composer">
  <textarea
    #input
    id="input"
    placeholder="Frage nach freien Fahrrädern, freien Plätzen oder Stationen..."
    (keydown.enter)="$event.preventDefault(); chatRequest(input.value); input.value = ''"
  ></textarea>

  <button
    type="button"
    [disabled]="isLoading()"
    (click)="chatRequest(input.value); input.value = ''"
  >
    {{ isLoading() ? 'Lädt...' : 'Frag CityBuddy' }}
  </button>
</div>
